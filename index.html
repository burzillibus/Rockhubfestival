<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Hub Festival</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>

    <div class="container">
        <h1>Rock Hub Festival 2026</h1>

        <div id="bandCarousel" class="carousel slide" data-ride="carousel">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <h2>Line-up</h2>
                    <div class="band-grid">
                        <div class="band">Band 1</div>
                        <div class="band">Band 2</div>
                        <div class="band">Band 3</div>
                        <!-- More bands here -->
                    </div>
                </div>
                <div class="carousel-item">
                    <h2>Line-up</h2>
                    <div class="band-grid">
                        <div class="band">Band 4</div>
                        <div class="band">Band 5</div>
                        <div class="band">Band 6</div>
                        <!-- More bands here -->
                    </div>
                </div>
            </div>
            <a class="carousel-control-prev" href="#bandCarousel" role="button" data-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="sr-only">Previous</span>
            </a>
            <a class="carousel-control-next" href="#bandCarousel" role="button" data-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="sr-only">Next</span>
            </a>
            <ol class="carousel-indicators">
                <li data-target="#bandCarousel" data-slide-to="0" class="active"></li>
                <li data-target="#bandCarousel" data-slide-to="1"></li>
                <!-- More indicators here -->
            </ol>
        </div>

        <div id="sponsorCarousel" class="carousel slide mt-5" data-ride="carousel">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <h2>Sponsors</h2>
                    <div class="sponsor-grid">
                        <div class="sponsor">Sponsor 1</div>
                        <div class="sponsor">Sponsor 2</div>
                        <div class="sponsor">Sponsor 3</div>
                        <!-- More sponsors here -->
                    </div>
                </div>
                <div class="carousel-item">
                    <h2>Sponsors</h2>
                    <div class="sponsor-grid">
                        <div class="sponsor">Sponsor 4</div>
                        <div class="sponsor">Sponsor 5</div>
                        <div class="sponsor">Sponsor 6</div>
                        <!-- More sponsors here -->
                    </div>
                </div>
            </div>
            <a class="carousel-control-prev" href="#sponsorCarousel" role="button" data-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="sr-only">Previous</span>
            </a>
            <a class="carousel-control-next" href="#sponsorCarousel" role="button" data-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="sr-only">Next</span>
            </a>
            <ol class="carousel-indicators">
                <li data-target="#sponsorCarousel" data-slide-to="0" class="active"></li>
                <li data-target="#sponsorCarousel" data-slide-to="1"></li>
                <!-- More indicators here -->
            </ol>
        </div>

    </div>

</body>
</html>
