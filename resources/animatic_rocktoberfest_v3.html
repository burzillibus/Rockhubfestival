<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Rocktoberfest — Animatic Video</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0d0f0c; --void-2:#171712;
    --patina:#2f6f63; --patina-dark:#173430;
    --rust:#9c5a34; --rust-dark:#5c3116;
    --blood:#a91f1f; --blood-dark:#5e1010;
    --amber:#e3a83c; --cream:#ede3cc;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:100%;height:100%;background:#08090a;overflow:hidden;font-family:'Oswald',sans-serif;}

  .stage{
    position:relative; width:100%; aspect-ratio:4/5; max-width:640px; margin:0 auto;
    overflow:hidden;
    background: radial-gradient(120% 90% at 50% -10%, #1c2b26 0%, var(--void) 45%, #08090a 100%);
    color:var(--cream);
  }
  .texture{
    position:absolute; inset:-10%;
    background:
      radial-gradient(circle at 20% 30%, rgba(47,111,99,0.35), transparent 40%),
      radial-gradient(circle at 80% 75%, rgba(156,90,52,0.30), transparent 45%),
      radial-gradient(circle at 60% 15%, rgba(169,31,31,0.18), transparent 35%);
    filter:blur(2px); mix-blend-mode:screen; opacity:.9;
    animation: driftTexture 26s ease-in-out infinite alternate;
  }
  @keyframes driftTexture{ 0%{transform:translate(0,0) scale(1);} 100%{transform:translate(-3%,2%) scale(1.06);} }
  .vignette{ position:absolute; inset:0; box-shadow: inset 0 0 160px 60px rgba(0,0,0,0.75); pointer-events:none; z-index:20;}

  /* progress bar for the timeline demo */
  .progress-track{ position:absolute; top:0; left:0; right:0; height:4px; background:rgba(255,255,255,0.1); z-index:30; }
  .progress-fill{ height:100%; width:0%; background:var(--amber); }

  .clock{ position:absolute; top:10px; right:10px; z-index:30; font-family:'Oswald',sans-serif; font-size:12px; letter-spacing:.08em; color:var(--amber); background:rgba(0,0,0,.4); padding:3px 8px; border-radius:3px;}

  /* --- corner-docked logos (persist once docked) --- */
  .logo-el{
    position:absolute; z-index:15;
    opacity:0;
    transition: top 1s cubic-bezier(.3,.8,.3,1), left 1s cubic-bezier(.3,.8,.3,1),
                width 1s cubic-bezier(.3,.8,.3,1), transform 1s cubic-bezier(.3,.8,.3,1),
                opacity .6s ease;
    transform:translate(-50%,-50%);
  }
  .logo-el img, .logo-el .placeholder-badge{ display:block; width:100%; filter: drop-shadow(0 8px 18px rgba(0,0,0,.55)); }

  #logo1{ top:38%; left:50%; width:46%; }
  #logo1.corner{ top:9%; left:12%; width:15%; }

  #logo2{ top:38%; left:50%; width:40%; }
  #logo2.corner{ top:9%; left:88%; width:15%; }

  .placeholder-badge{
    aspect-ratio:1/1; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #1c3f38, #0c221d 70%);
    border:3px solid var(--patina);
    display:flex; align-items:center; justify-content:center;
    text-align:center; padding:8%;
  }
  .placeholder-badge span{ font-family:'Rye',serif; color:var(--amber); font-size:clamp(10px,3.2vw,16px); line-height:1.1; }

  /* --- hero placeholder scenes (band / beer) --- */
  .hero-scene{
    position:absolute; inset:6% 8%; z-index:12;
    display:flex; align-items:center; justify-content:center;
    border-radius:6px; overflow:hidden;
    opacity:0; transition: opacity .8s ease;
    background:linear-gradient(160deg, var(--void-2), #05060480 100%);
  }
  .scene-label{
    position:absolute; bottom:10px; left:50%; transform:translateX(-50%);
    font-size:11px; letter-spacing:.14em; color:rgba(237,227,204,.55);
    text-transform:uppercase; background:rgba(0,0,0,.4); padding:3px 10px; border-radius:3px;
  }

  /* band placeholder: pulsing equalizer */
  #bandScene .eq{ display:flex; align-items:flex-end; gap:8px; height:40%; }
  #bandScene .eq span{ width:14px; background:linear-gradient(180deg,var(--amber),var(--rust)); border-radius:3px; animation: bounce 0.5s ease-in-out infinite alternate; }
  #bandScene .eq span:nth-child(1){ height:35%; animation-delay:0s; }
  #bandScene .eq span:nth-child(2){ height:70%; animation-delay:.1s; }
  #bandScene .eq span:nth-child(3){ height:45%; animation-delay:.2s; }
  #bandScene .eq span:nth-child(4){ height:90%; animation-delay:.05s; }
  #bandScene .eq span:nth-child(5){ height:55%; animation-delay:.25s; }
  #bandScene .eq span:nth-child(6){ height:75%; animation-delay:.15s; }
  @keyframes bounce{ from{ transform:scaleY(.5); } to{ transform:scaleY(1); } }
  #bandScene .caption{ position:absolute; top:14%; font-family:'Rye',serif; color:var(--blood); font-size:clamp(20px,6vw,28px); text-align:center; width:100%; }

  /* beer placeholder: filling glass */
  #beerScene .glass{ position:relative; width:34%; aspect-ratio:2/3; border:4px solid rgba(237,227,204,.5); border-top:none; border-radius:0 0 14px 14px; overflow:hidden; background:rgba(255,255,255,.03); }
  #beerScene .liquid{ position:absolute; bottom:0; left:0; right:0; height:0%; background:linear-gradient(180deg,#f3c765,#d89b3c); animation: fill 3.2s ease-in-out infinite; }
  #beerScene .foam{ position:absolute; left:0; right:0; height:14px; background:#f4ecd8; border-radius:2px; bottom:0; animation: foamrise 3.2s ease-in-out infinite; }
  @keyframes fill{ 0%{ height:0%; } 60%{ height:80%; } 100%{ height:80%; } }
  @keyframes foamrise{ 0%{ bottom:0; opacity:0;} 55%{ bottom:78%; opacity:1;} 100%{ bottom:78%; opacity:1;} }

  /* --- final layout text elements --- */
  .final-el{ position:absolute; left:0; right:0; text-align:center; z-index:14; opacity:0; transition:opacity .8s ease; padding:0 8%; }
  #titleFinal{ top:30%; font-family:'Rye',serif; font-size:clamp(38px,10.5vw,58px); color:var(--blood); line-height:.95; text-shadow:2px 2px 0 #3b0c0c; }
  #subtitleFinal{ top:47%; font-family:'Oswald',sans-serif; font-size:clamp(13px,3.2vw,17px); color:var(--cream); line-height:1.4; }
  #footerFinal{ bottom:6%; display:flex; flex-direction:column; align-items:center; gap:8px; }
  #footerFinal .dates{ font-family:'Oswald',sans-serif; font-weight:700; font-size:clamp(18px,4.8vw,24px); color:var(--cream); }
  #footerFinal .venue{ font-family:'Oswald',sans-serif; font-weight:500; font-size:clamp(11px,2.8vw,13px); color:var(--patina); letter-spacing:.08em; text-transform:uppercase; }
  #footerFinal .cta{ margin-top:2px; font-family:'Oswald',sans-serif; font-weight:600; font-size:clamp(10px,2.6vw,12px); letter-spacing:.12em; text-transform:uppercase; color:var(--void); background:var(--amber); padding:8px 20px; border-radius:2px; }

  .replay{
    position:absolute; bottom:10px; right:10px; z-index:30;
    font-family:'Oswald',sans-serif; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    background:rgba(0,0,0,.5); color:var(--amber); border:1px solid var(--amber);
    padding:5px 12px; border-radius:3px; cursor:pointer;
  }
</style>
</head>

<script>
const stage = document.getElementById('stage');
const logo1 = document.getElementById('logo1');
const logo2 = document.getElementById('logo2');
const bandScene = document.getElementById('bandScene');
const beerScene = document.getElementById('beerScene');
const titleFinal = document.getElementById('titleFinal');
const subtitleFinal = document.getElementById('subtitleFinal');
const footerFinal = document.getElementById('footerFinal');
const progressFill = document.getElementById('progressFill');
const clock = document.getElementById('clock');

const TOTAL_MS = 16000;
let timers = [];
let startTime = null;
let rafId = null;

function reset(){
  timers.forEach(t => clearTimeout(t));
  timers = [];
  if(rafId) cancelAnimationFrame(rafId);
  [logo1,logo2].forEach(el => { el.classList.remove('corner'); el.style.opacity = 0; });
  [bandScene,beerScene,titleFinal,subtitleFinal,footerFinal].forEach(el => el.style.opacity = 0);
  progressFill.style.width = '0%';
  clock.textContent = '0.0s';
}

function at(ms, fn){ timers.push(setTimeout(fn, ms)); }

function playTimeline(){
  reset();
  startTime = performance.now();

  // Scene 1: logo1 hero -> corner
  at(50, () => { logo1.style.opacity = 1; });
  at(2200, () => { logo1.classList.add('corner'); });

  // Scene 2: logo2 hero -> corner
  at(3200, () => { logo2.style.opacity = 1; });
  at(5400, () => { logo2.classList.add('corner'); });

  // Scene 3: band -> title
  at(6400, () => { bandScene.style.opacity = 1; });
  at(8600, () => { bandScene.style.opacity = 0; titleFinal.style.opacity = 1; });

  // Scene 4: beer -> subtitle
  at(9400, () => { beerScene.style.opacity = 1; });
  at(11600, () => { beerScene.style.opacity = 0; subtitleFinal.style.opacity = 1; });

  // Scene 5: full reveal
  at(12400, () => { footerFinal.style.opacity = 1; });

  // progress + clock loop
  function tick(now){
    const elapsed = now - startTime;
    const pct = Math.min(elapsed / TOTAL_MS, 1);
    progressFill.style.width = (pct*100) + '%';
    clock.textContent = (elapsed/1000).toFixed(1) + 's';
    if(elapsed < TOTAL_MS + 2000){
      rafId = requestAnimationFrame(tick);
    }
  }
  rafId = requestAnimationFrame(tick);

  at(TOTAL_MS + 2000, playTimeline); // loop after a short hold
}

playTimeline();
</script>
